<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WIZAMAP Layouts · 49 × S/M/L</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font:15px Georgia,serif;background:#eee4d1;color:#49362b}header{background:#3b2925;color:#f2e5cd;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}h1{font-size:18px;font-weight:normal;margin:0 auto 0 0}select{font:inherit;padding:6px;background:#f9f1e2;border:1px solid #b09a77;border-radius:5px}main{height:calc(100dvh - 60px);padding:10px}#map{height:100%;width:100%;border:2px solid #b6a17e;border-radius:8px;display:grid;place-items:center;background:#e9dcc2}#map svg{width:100%;height:100%;object-fit:contain}small{font-size:12px}@media(max-width:660px){h1{width:100%}main{height:calc(100dvh - 102px)}}</style></head><body><header><h1>WIZAMAP · 49 layout sạch</h1><label>Layout <select id="layout"></select></label><label>Size <select id="size"><option>S</option><option selected>M</option><option>L</option></select></label><small id="counter"></small></header><main><div id="map">Đang mở layout...</div></main><script>
'use strict';// Viewer only. No editor, custom paint, drag/drop, asset library or duplicate SVGs.
const CDN='https://cdn.jsdelivr.net/gh/Ngoc1804/wzw-hogwarts-map-2@1c96e53d2982ff2969a58335c859e1985d0afcd4/assets/';const el=id=>document.getElementById(id);let DATA,IDS;
function show(){let id=el('layout').value,size=el('size').value,a=DATA[id]?.[size],host=el('map');host.replaceChildren();if(!a){host.textContent='Không có layout '+id+'/'+size;return;}try{
const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+a.width+' '+a.height);svg.setAttribute('role','img');svg.setAttribute('aria-label',id+' '+size);
const fragments=a.sceneSvg?[a.sceneSvg.replace(/^<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'')]:[a.defs||'',a.floorSvg||'',a.architectureSvg||'',a.decorSvg||''];
const xml='<svg xmlns="'+ns+'">'+fragments.join('')+(a.objects||[]).map(o=>o.svg).join('')+'</svg>',doc=new DOMParser().parseFromString(xml,'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('SVG không hợp lệ');
for(const item of [...doc.documentElement.children])svg.append(document.importNode(item,true));for(const item of [...svg.querySelectorAll('[data-layer="front-wall-foreground"]')])svg.append(item);host.append(svg);el('counter').textContent=(IDS.indexOf(id)+1)+' / '+IDS.length;
}catch(e){host.textContent='Lỗi layout: '+e.message;console.error(e)}}
(async()=>{try{let url=location.protocol==='file:'?CDN+'layout-sizes.json':'../assets/layout-sizes.json',r;try{r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status)}catch{r=await fetch(CDN+'layout-sizes.json');if(!r.ok)throw Error('CDN HTTP '+r.status)}DATA=await r.json();IDS=Object.keys(DATA).sort();if(IDS.length!==49||IDS.some(id=>['S','M','L'].some(s=>!DATA[id][s])))throw Error('Thiếu layout hoặc kích thước');for(const id of IDS){let o=document.createElement('option');o.value=id;o.textContent=id.replace(/_/g,' ');el('layout').append(o)}el('layout').onchange=show;el('size').onchange=show;show()}catch(e){el('map').textContent='Không tải được layout: '+e.message;console.error(e)}})();
</script></body></html>
